[project]
name = "motif"
version = "1.0.0"
description = "Cross-platform mouse & keyboard recorder / auto clicker (macOS, Linux, Windows). Record, edit, replay — image waits, humanize, tray, local API."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "motif",
  "mouse-recorder",
  "keyboard-recorder",
  "macro-recorder",
  "auto-clicker",
  "autoclicker",
  "automation",
  "tinytask",
  "pyside6",
  "macos",
  "linux",
  "windows",
]
dependencies = [
    "PySide6>=6.6.0",
    "pynput>=1.7.7",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
motif = "motif.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

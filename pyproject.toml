[project]
name = "motif"
version = "1.0.0"
description = "Motif: cross-platform mouse and keyboard recorder, auto-clicker, and macro replay with a visual editor"
readme = "README.md"
requires-python = ">=3.11"
keywords = [
    "motif",
    "auto-clicker",
    "autoclicker",
    "auto clicker",
    "mouse-recorder",
    "keyboard-recorder",
    "macro-recorder",
    "input-recorder",
    "input-replay",
    "macro replay",
    "replay",
    "automation",
    "pynput",
    "macos",
    "windows",
    "linux",
]
dependencies = [
    "PySide6>=6.6.0",
    "pynput>=1.7.7",
    "mss>=9.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
motif = "motif.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["motif*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
